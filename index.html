<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Gallery | CodeAlpha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Image Gallery</h1>
    <p class="lede">Pick a category, then click any photo to view it full size. In the viewer, use the arrow keys to move between photos and Esc to close.</p>
    <div class="filters" id="filters" role="group" aria-label="Filter photos by category"></div>
    <p class="count" id="count" aria-live="polite"></p>
  </header>

  <main>
    <ul class="gallery" id="gallery"></ul>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Close viewer">&times;</button>
    <button class="lb-btn lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous photo">&#8249;</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="">
      <figcaption>
        <span id="lbTitle"></span>
        <span id="lbCount"></span>
      </figcaption>
    </figure>
    <button class="lb-btn lb-nav lb-next" id="lbNext" type="button" aria-label="Next photo">&#8250;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
